[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aniworld-cli"
version = "0.2.7"
description = "Pure-Python streaming-only CLI for aniworld.to (mpv via subprocess)"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [{ name = "dxmoc" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "iterfzf>=1.9",
]

[project.scripts]
aniworld-cli = "aniworld_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["aniworld_cli*"]

# The Anime4K .glsl files are data, not code: a wheel only ships them with this
# block. PyInstaller needs --collect-data on top of it (see release.yml).
[tool.setuptools.package-data]
"aniworld_cli.shaders" = ["*.glsl"]
