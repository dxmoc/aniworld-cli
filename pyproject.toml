[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aniworld-cli"
version = "0.2.6"
description = "Pure-Python streaming-only CLI for aniworld.to (mpv via subprocess)"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [{ name = "dxmoc" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "iterfzf>=1.9",
]

[project.scripts]
aniworld-cli = "aniworld_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["aniworld_cli*"]

# The bundled mpv environment (mpv.conf, input.conf, scripts/, shaders/, fonts/)
# is data, not code: a wheel installed by install.sh only ships it with this
# block. PyInstaller needs --collect-data on top of this.
[tool.setuptools.package-data]
aniworld_cli = [
    "mpv/*.conf",
    "mpv/scripts/*.lua",
    "mpv/shaders/*.glsl",
    "mpv/fonts/*.ttf",
    "mpv/script-opts/*",
    "mpv/*.md",
]
