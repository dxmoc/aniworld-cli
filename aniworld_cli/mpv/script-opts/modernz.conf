# aniworld-cli defaults for ModernZ.
#
# This file is yours. It starts out with the pack's defaults and is refreshed
# when a pack update ships new ones -- but only as long as you have not changed
# it. Edit it and your version is kept from then on; delete it to get the
# defaults back.
#
# This has to live here rather than in mpv.conf: a "script-opts=" line there
# replaces this whole file, so one stray override would silently drop every
# setting below.
#
# Every ModernZ option can go here -- see the ModernZ README for the full list.

# --- on-screen buttons -----------------------------------------------------
# Three extra buttons, each opening an aniworld-cli menu (see input.conf).
#
# Labels are drawn in the bundled icon font, so the text is not really text:
#   * a ligature name is an icon -- "fluent_anime4k" draws the sparkle,
#     "fluent_anime4k_off" the same sparkle with a slash through it,
#     "fluent_shortcuts" the keyboard, "fluent_subtitles" the language badge.
#     The names are ligatures inside fonts/modernz-icons.ttf: the font is not
#     text, it swaps a whole name for one drawing.
#   * UPPERCASE text would survive, because this font has no uppercase letters
#     and the renderer falls back to a normal font -- but lowercase letters and
#     most digits are blank, zero-width placeholders here, so "Lang" renders as
#     just "L" and plain text labels are a trap. Use icons, or capitals only.
custom_button1=yes
custom_button1_label=fluent_anime4k
# Same sparkle, slashed. ModernZ picks it while
# user-data/aniworld/shaders-off is true, which aniworld.lua keeps in sync with
# the preset actually applied (so it is right on open, not just after a click).
custom_button1_label_off=fluent_anime4k_off
custom_button1_toggle_property=user-data/aniworld/shaders-off
custom_button1_tooltip=Anime4K on/off - right click to choose
# Left click toggles the last preset <-> off, right click opens the full menu.
custom_button1_command=script-binding aniworld/toggle-shaders
custom_button1_mbtn_right_command=script-binding aniworld/menu-shaders

custom_button2=yes
custom_button2_label=fluent_shortcuts
custom_button2_tooltip=All key bindings (Alt+k)
custom_button2_command=script-binding aniworld/menu-shortcuts

custom_button3=yes
custom_button3_label=fluent_subtitles
custom_button3_tooltip=Language (Alt+l)
custom_button3_command=script-binding aniworld/menu-language

# These streams carry exactly one audio track, and the "languages" are separate
# encodes with burned-in subtitles, so a track menu can only ever show one row.
# Off, with the Lang button above doing the useful thing instead.
audio_tracks_button=no

# --- downloading -----------------------------------------------------------
# ModernZ's OSC download button is off, and you probably want it to stay off.
# It runs yt-dlp on the already-resolved CDN URL with none of the headers the
# hoster requires (the CLI passes Referer/User-Agent to mpv only), always grabs
# the best variant rather than the quality picked in our menu, and names every
# file "master.<ext>" because a bare m3u8 has no title -- so each download
# overwrites the previous one. Worst of all, mpv's subprocess helper defaults to
# playback_only, so the job is killed the moment playback ends or the window
# closes, while the script still prints "Download saved to ...".
# Turn it back on only if you accept all of that.
download_button=no
