# aniworld-cli defaults for ModernZ.
#
# This file is written once, the first time the bundled mpv pack is
# materialised. It is never overwritten afterwards, so your edits survive
# updates. Delete it to get the defaults back.
#
# Every ModernZ option can go here -- see the ModernZ README for the full list.

# Extra button in the OSC that opens the Anime4K preset menu (same as Alt+u).
# It sits next to the audio/subtitle buttons and only appears on windows wide
# enough to fit the regular button row.
custom_button=yes
custom_button_label=A4K
custom_button_tooltip=Anime4K shaders (Alt+u)
custom_button_command=script-binding aniworld/menu-shaders
