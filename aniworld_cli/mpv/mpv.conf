# aniworld-cli bundled mpv configuration.
#
# Paths here are relative to this directory, so the same file works on Linux,
# macOS and Windows -- no per-OS paths. Put your own options into
# user-overlay.conf next to this file; it is never overwritten on updates.

# The player UI is our script (scripts/aniworld.lua) plus ModernZ.
osc=no
osd-bar=no

# Playing back a network stream: decode on the GPU, keep a healthy buffer.
hwdec=auto-safe
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=30
video-sync=display-resample

# aniworld-cli tracks resume points itself (state.json), not mpv.
save-position-on-quit=no

# Shader presets are set per playback by the app (--glsl-shaders), so this
# file must not set glsl-shaders: a user overlay then cannot break them.

# User overrides. The app creates this file empty on first run.
include=~~/user-overlay.conf
