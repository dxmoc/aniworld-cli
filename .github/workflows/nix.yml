name: nix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Check the flake
        run: nix flake check --print-build-logs --show-trace

      - name: Build the Anime4K packages
        run: >
          nix build --print-build-logs
          .#anime4k-shaders
          .#mpv-anime4k
          .#aniworld-cli-anime4k

      - name: The mpv wrapper carries the shaders and the script
        run: |
          mpv="$(nix eval --raw .#mpv-anime4k.outPath)"
          grep -q "share/anime4k/shaders" "$mpv/bin/mpv"
          grep -q "aniworld-anime4k-hq=no" "$mpv/bin/mpv"

          script="$(grep -o "script=[^ '\"]*aniworld-anime4k.lua" "$mpv/bin/mpv" | head -1 | cut -d= -f2-)"
          echo "script: $script"
          test -f "$script"
          grep -q 'Anime4K v4 profile switching' "$script"
          grep -q 'Ctrl+a' "$script"

          shaders="$(grep -o "shaders_dir=[^ '\",]*" "$mpv/bin/mpv" | head -1 | cut -d= -f2-)"
          echo "shaders: $shaders"
          test -f "$shaders/Upscale/Anime4K_Upscale_CNN_x2_M.glsl"

      - name: Every shader the script references is pinned
        run: |
          shaders="$(nix build --no-link --print-out-paths .#anime4k-shaders)"
          nix run --quiet nixpkgs#lua5_4 -- tests/mpv/aniworld-anime4k_test.lua mpv/aniworld-anime4k.lua > out.txt
          cat out.txt
          referenced="$(sed -n 's/^SHADERS //p' out.txt | tr ' ' '\n')"
          test -n "$referenced"
          count=0
          while read -r shader; do
            test -f "$shaders/share/anime4k/shaders/$shader"
            count=$((count + 1))
          done <<< "$referenced"
          test "$count" -eq 14
          echo "all $count shaders the script can load are in the store"

      - name: The bundled mpv shadows the plain one
        run: |
          nix build --print-build-logs .#aniworld-cli-anime4k -o result-cli
          ./result-cli/bin/aniworld-cli --version
          grep -q "$(nix eval --raw .#mpv-anime4k.outPath)/bin" result-cli/bin/aniworld-cli

      - name: The NixOS module evaluates
        run: |
          nix eval --show-trace --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              nixos = flake.inputs.nixpkgs.lib.nixosSystem {
                system = builtins.currentSystem;
                modules = [
                  flake.nixosModules.default
                  {
                    programs.aniworld-cli.enable = true;
                    programs.aniworld-cli.anime4k.enable = true;
                    programs.aniworld-cli.anime4k.mode = "c+a";
                  }
                ];
              };
            in
            map (package: package.outPath) nixos.config.environment.systemPackages
          '

      - name: The Home Manager module evaluates
        run: |
          nix eval --show-trace --impure --apply builtins.typeOf \
            --expr '(builtins.getFlake (toString ./.)).homeManagerModules.default'
