name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # builds and tests the Windows zip without releasing

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  windows-zip:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build aniworld-cli.exe
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          # PyInstaller needs a plain script; __main__.py uses relative imports.
          "import sys`nfrom aniworld_cli.__main__ import main`nsys.exit(main())" | Out-File -Encoding ascii launcher.py
          pyinstaller --noconfirm --console --name aniworld-cli --collect-all iterfzf launcher.py

      - name: Add mpv (official release build, the one Scoop installs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pinned: a new mpv only ships after its live playback was checked here.
          $tag = 'v0.41.0'
          gh release download $tag -R mpv-player/mpv --pattern "mpv-*-x86_64-pc-windows-msvc.zip" --output mpv.zip
          Expand-Archive mpv.zip dist\aniworld-cli\mpv
          Remove-Item dist\aniworld-cli\mpv\mpv.pdb  # 230 MB of debug symbols
          "mpv $tag for Windows, unchanged from https://github.com/mpv-player/mpv/releases/tag/$tag (source code there)" | Out-File -Encoding ascii dist\aniworld-cli\mpv\SOURCE.txt
          Compress-Archive -Path dist\aniworld-cli\* -DestinationPath aniworld-cli-windows.zip

      - name: Install with install.ps1 and run
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '8765' -WindowStyle Hidden
          Start-Sleep 2
          (Get-Content -Raw install.ps1) -replace 'https://github\.com/\S+\.zip', 'http://127.0.0.1:8765/aniworld-cli-windows.zip' | Invoke-Expression
          aniworld-cli --version
          $dir = Join-Path $env:LOCALAPPDATA 'aniworld-cli'
          & "$dir\mpv\mpv.exe" --version
          $fzf = Get-ChildItem $dir -Recurse -Filter fzf.exe | Select-Object -First 1
          $out = "a`nb" | & $fzf.FullName --filter b
          if ($out -ne 'b') { throw "bundled fzf failed: $out" }

      - name: Live playback with the bundled mpv, 5 s without window
        # aniworld.to may block GitHub's IP ranges, which says nothing about the code.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'aniworld-cli'
          New-Item -ItemType Directory -Force "$dir\mpv\portable_config" | Out-Null
          "vo=null`nao=null`nend=5" | Out-File -Encoding ascii "$dir\mpv\portable_config\mpv.conf"
          Get-ChildItem "$dir\mpv" | Format-Table Name, Length
          & "$dir\aniworld-cli.exe" frieren --no-menu --episode 1-1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: aniworld-cli-windows.zip

  release:
    needs: [test, windows-zip]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/download-artifact@v8
        with:
          name: windows-zip
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*
